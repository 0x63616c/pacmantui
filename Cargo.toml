[package]
name = "pacmantui"
version = "0.1.0"
edition = "2024"
description = "Pac-Man in the terminal with real pixel graphics via the Kitty Graphics Protocol"
license = "MIT"
repository = "https://github.com/0x63616c/pacmantui"

[dependencies]
base64 = "0.23.1"
crossterm = "0.29"
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[profile.release]
lto = true
codegen-units = 1
